<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AskMyDocs📄</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary:   "#534AB7",
            primarydk: "#3C3489",
            primarylt: "#EEEDFE",
            accent:    "#1D9E75",
          }
        }
      }
    }
  </script>
  <style>
    /* Scrollbar */
    #chat-box::-webkit-scrollbar { width: 5px; }
    #chat-box::-webkit-scrollbar-track { background: #f1f1f1; }
    #chat-box::-webkit-scrollbar-thumb { background: #c5c3e8; border-radius: 4px; }

    /* Typing dots animation */
    .dot { animation: blink 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }

    /* File drag highlight */
    #drop-zone.dragover { border-color: #534AB7; background: #EEEDFE; }

    /* Source chip */
    .source-chip {
      display: inline-block;
      background: #E1F5EE;
      color: #085041;
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 99px;
      border: 0.5px solid #9FE1CB;
    }
  </style>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header class="bg-primary border-b border-gray-200 px-6 py-3 flex items-center gap-3 shadow-sm">
    <span class="text-2xl">📄</span>
    <div>
      <h1 class="text-lg font-semibold text-white">AskMyDocs</h1>
    </div>
    <div class="ml-auto flex items-center gap-2">
      <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-gray-300"></span>
      <span id="status-text" class="text-xs text-white">No documents loaded</span>
    </div>
  </header>

  <!-- ── Main layout ─────────────────────────────────────────────────────── -->
  <div class="flex flex-1 overflow-hidden max-w-6xl mx-auto w-full mt-4 mb-4 px-4 gap-4">

    <!-- ── Sidebar ──────────────────────────────────────────────────────── -->
    <aside class="w-72 flex-shrink-0 flex flex-col gap-4">

      <!-- Upload card -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4">
        <h2 class="text-sm font-semibold text-gray-500 mb-3">UPLOAD</h2>

        <!-- Drop zone -->
        <div id="drop-zone"
             class="border-2 border-dashed border-gray-300 rounded-lg p-4 text-center cursor-pointer transition-colors hover:border-primary hover:bg-primarylt"
             onclick="document.getElementById('file-input').click()"
             ondragover="onDragOver(event)"
             ondragleave="onDragLeave(event)"
             ondrop="onDrop(event)">
          <p class="text-2xl mb-1">📤</p>
          <p class="text-xs text-gray-500">Click or drag PDF / TXT files here</p>
        </div>
        <input id="file-input" type="file" accept=".pdf,.txt" multiple class="hidden"
               onchange="onFileSelect(event)" />

        <!-- File list -->
        <ul id="file-list" class="mt-3 space-y-1 text-xs text-gray-600 max-h-32 overflow-y-auto"></ul>

        <!-- Ingest button -->
        <button id="ingest-btn"
                onclick="ingestFiles()"
                disabled
                class="mt-3 w-full py-2 rounded-lg text-sm font-medium
                       bg-primary text-white
                       hover:bg-primarydk transition-colors
                       disabled:opacity-40 disabled:cursor-not-allowed">
           Ingest Documents
        </button>

        <!-- Progress bar (hidden by default) -->
        <div id="progress-wrap" class="hidden mt-2">
          <div class="w-full bg-gray-100 rounded-full h-1.5">
            <div id="progress-bar" class="bg-primary h-1.5 rounded-full animate-pulse w-full"></div>
          </div>
          <p class="text-xs text-gray-400 mt-1 text-center">Processing…</p>
        </div>

        <!-- Success message -->
        <p id="ingest-msg" class="hidden mt-2 text-xs text-accent font-medium text-center"></p>
      </div>

      <!-- Stats card -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4">
        <h2 class="text-sm font-semibold text-gray-500 mb-3">SESSION STATS</h2>
        <div class="grid grid-cols-2 gap-2">
          <div class="bg-gray-50 rounded-lg p-2 text-center">
            <p id="stat-files" class="text-xl font-bold text-primary">0</p>
            <p class="text-xs text-gray-400 font-semibold">Files</p>
          </div>
          <div class="bg-gray-50 rounded-lg p-2 text-center">
            <p id="stat-chunks" class="text-xl font-bold text-primary">0</p>
            <p class="text-xs text-gray-400 font-semibold">Chunks</p>
          </div>
          <div class="bg-gray-50 rounded-lg p-2 text-center col-span-2">
            <p id="stat-questions" class="text-xl font-bold text-primary">0</p>
            <p class="text-xs text-gray-400 font-semibold">Questions asked</p>
          </div>
        </div>
      </div>

      <!-- Clear button -->
      <button onclick="clearCache()"
              class="w-full py-2 rounded-lg text-sm font-medium border border-gray-200
                     text-white hover:bg-primarydk transition-colors bg-primary shadow-sm">
        Clear Cache
      </button>

    </aside>

    <!-- ── Chat panel ────────────────────────────────────────────────────── -->
    <div class="flex-1 flex flex-col bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">

      <!-- Chat messages -->
      <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4">

        <!-- Welcome message -->
        <div id="welcome-msg" class="flex flex-col items-center justify-center h-full text-center py-12">
          <p class="text-4xl mb-1">📄</p>
          <p class="text-primary text-lg font-semibold">Upload documents, Ingest them<br>Ask anything about your notes</p>
        </div>

      </div>

      <!-- Input bar -->
      <div class="border-t border-gray-100 p-3 flex gap-2">
        <input id="chat-input"
               type="text"
               placeholder="Ask something about your notes…"
               onkeydown="if(event.key==='Enter') sendMessage()"
               class="flex-1 rounded-lg border border-gray-200 px-4 py-2 text-sm
                      focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                      disabled:bg-gray-50 disabled:text-gray-400"
               disabled />
        <button id="send-btn"
                onclick="sendMessage()"
                disabled
                class="px-4 py-2 rounded-lg bg-primary text-white text-sm font-medium
                       hover:bg-primarydk transition-colors
                       disabled:opacity-40 disabled:cursor-not-allowed">
          Send
        </button>
      </div>

    </div>
  </div>

  <!-- ── JavaScript ──────────────────────────────────────────────────────── -->
  <script>
    // ── State ──────────────────────────────────────────────────────────────
    let selectedFiles  = [];
    let questionCount  = 0;
    let totalChunks    = 0;
    let totalFiles     = 0;
    let docsReady      = false;

    // ── File handling ──────────────────────────────────────────────────────
    function onDragOver(e)  { e.preventDefault(); e.currentTarget.classList.add("dragover"); }
    function onDragLeave(e) { e.currentTarget.classList.remove("dragover"); }
    function onDrop(e) {
      e.preventDefault();
      e.currentTarget.classList.remove("dragover");
      addFiles([...e.dataTransfer.files]);
    }
    function onFileSelect(e) { addFiles([...e.target.files]); }

    function addFiles(files) {
      files.forEach(f => {
        if (!selectedFiles.find(x => x.name === f.name)) selectedFiles.push(f);
      });
      renderFileList();
    }

    function renderFileList() {
      const ul = document.getElementById("file-list");
      ul.innerHTML = selectedFiles.map((f, i) => `
        <li class="flex items-center justify-between gap-1">
          <span class="truncate">${f.name.length > 28 ? f.name.slice(0,25)+"…" : f.name}</span>
          <button onclick="removeFile(${i})" class="text-gray-300 hover:text-red-400 flex-shrink-0">✕</button>
        </li>
      `).join("");
      document.getElementById("ingest-btn").disabled = selectedFiles.length === 0;
    }

    function removeFile(i) { selectedFiles.splice(i, 1); renderFileList(); }

    // ── Ingest ─────────────────────────────────────────────────────────────
    async function ingestFiles() {
      if (!selectedFiles.length) return;

      const btn  = document.getElementById("ingest-btn");
      const prog = document.getElementById("progress-wrap");
      const msg  = document.getElementById("ingest-msg");

      btn.disabled = true;
      prog.classList.remove("hidden");
      msg.classList.add("hidden");

      const form = new FormData();
      selectedFiles.forEach(f => form.append("files", f));

      try {
        const res  = await fetch("/ingest", { method: "POST", body: form });
        const data = await res.json();

        if (!res.ok) throw new Error(data.detail || "Ingest failed");

        totalChunks += data.chunks;
        totalFiles  += selectedFiles.length;

        document.getElementById("stat-chunks").textContent = totalChunks;
        document.getElementById("stat-files").textContent  = totalFiles;

        msg.textContent = `✅ ${data.chunks} chunks indexed from ${selectedFiles.length} file(s)`;
        msg.classList.remove("hidden");

        selectedFiles = [];
        renderFileList();
        setReady(true);

      } catch (err) {
        msg.textContent = "❌ " + err.message;
        msg.classList.remove("hidden");
        btn.disabled = false;
      } finally {
        prog.classList.add("hidden");
      }
    }

    // ── Chat ───────────────────────────────────────────────────────────────
    function setReady(ready) {
      docsReady = ready;
      document.getElementById("chat-input").disabled  = !ready;
      document.getElementById("send-btn").disabled    = !ready;
      document.getElementById("status-dot").className =
        "w-2.5 h-2.5 rounded-full " + (ready ? "bg-accent" : "bg-gray-300");
      document.getElementById("status-text").textContent =
        ready ? "Ready" : "No documents loaded";
    }

    function appendMessage(role, html, sources = []) {
      const box = document.getElementById("chat-box");

      // Remove welcome message on first real message
      const welcome = document.getElementById("welcome-msg");
      if (welcome) welcome.remove();

      const isUser = role === "user";
      const wrapper = document.createElement("div");
      wrapper.className = "flex gap-3 " + (isUser ? "justify-end" : "justify-start");

      const avatar = isUser ? "🧑" : "🤖";
      const bubbleClass = isUser
        ? "bg-primarylt text-gray-800 rounded-2xl rounded-tr-sm"
        : "bg-gray-50 text-gray-800 rounded-2xl rounded-tl-sm border border-gray-100";

      let sourcesHTML = "";
      if (sources.length) {
        sourcesHTML = `
          <details class="mt-2">
            <summary class="text-xs text-gray-400 cursor-pointer hover:text-gray-600">
              📎 ${sources.length} source chunk${sources.length > 1 ? "s" : ""}
            </summary>
            <div class="mt-2 space-y-2">
              ${sources.map(s => `
                <div class="bg-white border border-gray-100 rounded-lg p-2 text-xs text-gray-500">
                  <span class="source-chip mr-1">Chunk ${s.chunk} · Page ${s.page}</span>
                  <p class="mt-1 text-gray-400 leading-relaxed">${s.text}</p>
                </div>
              `).join("")}
            </div>
          </details>`;
      }

      wrapper.innerHTML = `
        ${!isUser ? `<div class="w-8 h-8 rounded-full bg-primarylt flex items-center justify-center text-base flex-shrink-0">${avatar}</div>` : ""}
        <div class="max-w-[75%] px-4 py-2.5 ${bubbleClass}">
          <div class="text-sm leading-relaxed">${html}</div>
          ${sourcesHTML}
        </div>
        ${isUser ? `<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-base flex-shrink-0">${avatar}</div>` : ""}
      `;

      box.appendChild(wrapper);
      box.scrollTop = box.scrollHeight;
      return wrapper;
    }

    function appendTyping() {
      const box = document.getElementById("chat-box");
      const el  = document.createElement("div");
      el.id = "typing-indicator";
      el.className = "flex gap-3 justify-start";
      el.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-primarylt flex items-center justify-center text-base flex-shrink-0">🤖</div>
        <div class="bg-gray-50 border border-gray-100 rounded-2xl rounded-tl-sm px-4 py-3 flex gap-1 items-center">
          <span class="dot w-2 h-2 bg-gray-400 rounded-full inline-block"></span>
          <span class="dot w-2 h-2 bg-gray-400 rounded-full inline-block"></span>
          <span class="dot w-2 h-2 bg-gray-400 rounded-full inline-block"></span>
        </div>`;
      box.appendChild(el);
      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("chat-input");
      const q     = input.value.trim();
      if (!q) return;

      input.value = "";
      input.disabled = true;
      document.getElementById("send-btn").disabled = true;

      appendMessage("user", q);
      appendTyping();

      try {
        const res  = await fetch("/ask", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ question: q })
        });
        const data = await res.json();

        document.getElementById("typing-indicator")?.remove();

        if (!res.ok) throw new Error(data.detail || "Something went wrong");

        appendMessage("assistant", data.answer, data.sources || []);
        questionCount++;
        document.getElementById("stat-questions").textContent = questionCount;

      } catch (err) {
        document.getElementById("typing-indicator")?.remove();
        appendMessage("assistant", `⚠️ ${err.message}`);
      } finally {
        input.disabled  = false;
        input.disabled  = !docsReady;
        document.getElementById("send-btn").disabled = !docsReady;
        input.focus();
      }
    }

    // ── Clear cache ─────────────────────────────────────────────────────────
    async function clearCache() {
      await fetch("/clear", { method: "POST" });
      setReady(false);
      totalChunks = 0; totalFiles = 0; questionCount = 0;
      document.getElementById("stat-chunks").textContent    = 0;
      document.getElementById("stat-files").textContent     = 0;
      document.getElementById("stat-questions").textContent = 0;
      document.getElementById("chat-box").innerHTML = `
        <div id="welcome-msg" class="flex flex-col items-center justify-center h-full text-center py-12">
          <p class="text-4xl mb-3">💬</p>
          <p class="text-gray-500 text-sm">Upload documents and ingest them,<br>then ask anything about your notes.</p>
        </div>`;
    }

    // Auto-detect existing chroma_db on load
    window.addEventListener("load", async () => {
      try {
        const res = await fetch("/ask", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ question: "ping" })
        });
        if (res.ok) setReady(true);
      } catch (_) {}
    });
  </script>
</body>
</html>
